name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you have tried
  - type: checkboxes
    id: scope
    attributes:
      label: Checks
      options:
        - label: This keeps the app offline and does not change existing export results unless explicitly chosen.
